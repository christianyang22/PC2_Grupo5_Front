<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Buscador global superior -->
<div class="container mt-5 pt-5 mb-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="input-group shadow-sm">
        <span class="input-group-text bg-success text-white border-success"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control border-success" [(ngModel)]="terminoBusqueda"
               (keyup.enter)="aplicarBusqueda()" placeholder="Buscar favoritos..." />
        <button class="btn btn-success" (click)="aplicarBusqueda()">Buscar</button>
      </div>
    </div>
  </div>
</div>

<!-- Favoritos -->
<div class="container pb-5" style="padding-top: 100px;">
  <div *ngIf="!cargado" class="text-center my-4">
    <img src="img/spinner.gif" alt="Cargando..." class="spinner-gif-top" />
  </div>

  <div class="row g-4" *ngIf="favoritosFiltrados.length > 0">
    <div class="col-sm-12 col-md-6 col-lg-4" *ngFor="let favorito of obtenerFavoritosPaginaActual()">
      <div class="card h-100 border-0 shadow-sm rounded-4 position-relative">

        <!-- Botón para eliminar favorito -->
        <div class="position-absolute top-0 end-0 m-2" (click)="eliminarFavorito(favorito)">
          <i class="bi bi-star-fill text-warning" style="font-size: 1.5rem; cursor: pointer;"></i>
        </div>

        <!-- Logo supermercado -->
        <img [src]="ImagenSupermercado(favorito.product?.supermercado)" class="position-absolute"
             [alt]="favorito.product?.supermercado" style="top: 0.5rem; left: 0.5rem; height: 28px; z-index: 10;" />

        <!-- Imagen del producto -->
        <img [src]="favorito.product?.link_imagen || 'assets/placeholder.jpg'"
             class="card-img-top img-fluid p-3"
             [alt]="favorito.product?.nombre"
             style="height: 150px; object-fit: contain;" />

        <!-- Cuerpo tarjeta -->
        <div class="card-body text-center">
          <h6 class="card-title fw-semibold text-dark" style="min-height: 48px;">
            {{ favorito.product?.nombre }}
          </h6>
          <p class="card-text text-muted mb-1">Supermercado: {{ favorito.product?.supermercado }}</p>
          <p class="card-text fw-bold text-success">Precio: {{ favorito.product?.precio }} €</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Paginación -->
  <div *ngIf="totalPages > 1" class="d-flex justify-content-center align-items-center my-5">
    <button class="btn btn-outline-success me-3 rounded-pill px-4" (click)="anteriorPagina()" [disabled]="currentPage === 1">
      Anterior
    </button>
    <span class="fw-bold text-dark">Página {{ currentPage }} de {{ totalPages }}</span>
    <button class="btn btn-outline-success ms-3 rounded-pill px-4" (click)="siguientePagina()" [disabled]="currentPage === totalPages">
      Siguiente
    </button>
  </div>

  <!-- Sin resultados -->
  <div *ngIf="favoritosFiltrados.length === 0 && cargado" class="alert alert-warning text-center mt-3">
    No se encontraron favoritos.
  </div>
</div>
