<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<div class="container mt-5 pt-5 mb-3">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="input-group shadow-sm">
        <span class="input-group-text bg-success text-white border-success"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control border-success" [(ngModel)]="terminoBusqueda"
               (keyup.enter)="aplicarFiltrosYBusqueda()" placeholder="Buscar productos..." />
        <button class="btn btn-success" (click)="aplicarFiltrosYBusqueda()">Buscar</button>
      </div>
    </div>
  </div>
</div>

<div class="container mb-4">
  <button *ngIf="rolUsuario === 1 || rolUsuario === 2" class="btn btn-success rounded-pill px-4 shadow-sm" data-bs-toggle="modal" data-bs-target="#filtrosModal">
    <i class="bi bi-funnel-fill me-2"></i>Filtros
  </button>
</div>

<div class="modal fade" id="filtrosModal" tabindex="-1" aria-labelledby="filtrosModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content rounded-4 shadow">
      <div class="modal-header border-bottom-0">
        <h5 class="modal-title fw-bold text-success" id="filtrosModalLabel">Filtros Avanzados</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <input type="text" class="form-control form-control-lg" [(ngModel)]="terminoBusqueda"
            name="terminoBusqueda" placeholder="🔍 Buscar productos..." />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-success">Precio (€): {{ precioMin }} - {{ precioMax }}</label>
          <ngx-slider [(value)]="precioMin" [(highValue)]="precioMax" [options]="optionsPrecio"></ngx-slider>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-success">Grasas (g): {{ grasaMin }} - {{ grasaMax }}</label>
          <ngx-slider [(value)]="grasaMin" [(highValue)]="grasaMax" [options]="optionsGrasa"></ngx-slider>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-success">Hidratos (g): {{ hidratosMin }} - {{ hidratosMax }}</label>
          <ngx-slider [(value)]="hidratosMin" [(highValue)]="hidratosMax" [options]="optionsHidratos"></ngx-slider>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold text-success">Azúcar (g): {{ azucarMin }} - {{ azucarMax }}</label>
          <ngx-slider [(value)]="azucarMin" [(highValue)]="azucarMax" [options]="optionsAzucar"></ngx-slider>
        </div>
      </div>
      <div class="modal-footer border-top-0">
        <button class="btn btn-outline-success rounded-pill px-4" (click)="limpiarBusqueda()">Limpiar</button>
        <button class="btn btn-success rounded-pill px-4" (click)="aplicarFiltrosYBusqueda()" data-bs-dismiss="modal">Buscar</button>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid pb-5" style="padding-bottom: 180px;">
  <div class="row">
    <div class="col-12">
      <div *ngIf="mensajeCarrito" class="alert alert-success text-center w-75 mx-auto mt-2 shadow-sm">
        {{ mensajeCarrito }}
      </div>

      <div *ngIf="productos.length === 0" class="text-center my-4">
        <img src="img/spinner.gif" alt="Cargando..." class="spinner-gif-top" />
      </div>

      <div class="row g-4" *ngIf="productosFiltrados.length > 0">
        <div class="col-md-6 col-lg-4" *ngFor="let producto of obtenerProductosPaginaActual()">
          <div class="card h-100 border-0 shadow-sm rounded-4 position-relative">
            <div class="position-absolute top-0 end-0 m-2" (click)="toggleFavorito(producto)">
              <i class="bi"
                [ngClass]="esFavorito(producto.id_producto) ? 'bi-star-fill text-warning' : 'bi-star text-secondary'"
                style="font-size: 1.5rem; cursor: pointer;"></i>
            </div>

            <img [src]="ImagenSupermercado(producto.supermercado)" [alt]="producto.supermercado"
              class="position-absolute" style="top: 0.5rem; left: 0.5rem; height: 28px; z-index: 10;" />

            <img [src]="producto.link_imagen || 'assets/placeholder.jpg'" class="card-img-top img-fluid p-3"
              [alt]="producto.nombre" style="height: 150px; object-fit: contain;" />

            <div class="card-body text-center">
              <h6 class="card-title fw-semibold text-dark" style="min-height: 48px;">
                {{ producto.nombre }}
              </h6>
              <p class="card-text text-muted mb-1">Supermercado: {{ producto.supermercado }}</p>
              <p class="card-text fw-bold text-success">Precio: {{ producto.precio }} €</p>
              <button class="btn btn-outline-primary btn-sm mt-2" (click)="agregarAlCarrito(producto)">
                <i class="bi bi-cart-plus"></i> Añadir al carrito
              </button>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="totalPages > 1 && productosFiltrados.length > 0"
        class="d-flex justify-content-center align-items-center my-5">
        <button class="btn btn-outline-success me-3 rounded-pill px-4" (click)="anteriorPagina()" [disabled]="currentPage === 1">
          Anterior
        </button>
        <span class="fw-bold text-dark">Página {{ currentPage }} de {{ totalPages }}</span>
        <button class="btn btn-outline-success ms-3 rounded-pill px-4" (click)="siguientePagina()" [disabled]="currentPage === totalPages">
          Siguiente
        </button>
      </div>

      <div *ngIf="productosFiltrados.length === 0 && productos.length > 0" class="alert alert-warning text-center mt-3">
        No se encontraron productos con los filtros aplicados.
      </div>
    </div>
  </div>
</div>
