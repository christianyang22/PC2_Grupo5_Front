<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container d-flex justify-content-center" style="margin-top: 150px;">
  <div class="w-100" style="max-width: 700px;">
    <h5 class="text-success text-center mb-4">🛒 Carrito de la compra</h5>

    <ul class="list-group mb-3">
      <li *ngFor="let prod of carritoService.obtenerProductos(); let i = index"
          class="list-group-item d-flex justify-content-between align-items-center">

        <div class="d-flex align-items-center me-auto">
          <img [src]="prod?.link_imagen || 'assets/placeholder.jpg'"
               alt="Producto"
               style="width: 60px; height: 60px; object-fit: contain;"
               class="me-3 rounded shadow-sm" />
          <span>
            {{ prod?.nombre || 'Producto sin nombre' }}
            <span *ngIf="prod?.cantidad > 1" class="text-muted ms-2">(x{{ prod.cantidad }})</span>
          </span>
        </div>

        <div class="d-flex align-items-center">
          <span class="badge bg-success rounded-pill me-3">
            {{ prod?.precio !== undefined ? ((prod.precio * prod.cantidad) | number:'1.2-2') + ' €' : 'N/D' }}
          </span>
          <button class="btn btn-sm btn-outline-danger" (click)="eliminarDelCarrito(i)">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </li>
    </ul>

    <div class="text-end fw-bold">
      Total: {{ obtenerTotalCarrito() | number:'1.2-2' }} €
    </div>
  </div>
</div>
