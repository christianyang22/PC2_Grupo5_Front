<!-- Bootstrap Icons & CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<section class="container d-flex justify-content-center py-5" style="padding-bottom: 100px;">
  <div class="w-100" style="max-width: 700px;">

    <!-- Título centrado -->
    <div class="text-center mb-4" style="margin-top: 150px;">
      <h5 class="text-success fw-semibold d-inline-block">
        <i class="bi bi-cart3 me-2"></i>Carrito de la compra
      </h5>
    </div>



    <!-- Lista de productos -->
    <ul class="list-group mb-4">
      <li *ngFor="let prod of carritoService.obtenerProductos(); let i = index"
          class="list-group-item d-flex justify-content-between align-items-center">

        <div class="d-flex align-items-center me-auto">
          <img [src]="prod?.link_imagen || 'assets/placeholder.jpg'"
               alt="Producto"
               style="width: 60px; height: 60px; object-fit: contain;"
               class="me-3 rounded shadow-sm" />
          <span>
            {{ prod?.nombre || 'Producto sin nombre' }}
            <span *ngIf="prod?.cantidad > 1" class="text-muted ms-2">(x{{ prod.cantidad }})</span>
          </span>
        </div>

        <div class="d-flex align-items-center">
          <span class="badge bg-success rounded-pill me-3">
            {{ prod?.precio !== undefined ? ((prod.precio * prod.cantidad) | number:'1.2-2') + ' €' : 'N/D' }}
          </span>
          <button class="btn btn-sm btn-outline-danger" (click)="eliminarDelCarrito(i)">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </li>
    </ul>

    <!-- Total + Botón Finalizar centrado -->
    <div class="d-flex flex-column align-items-center" style="margin-bottom: 100px;">
      <div class="fw-bold mb-3">
        Total: {{ obtenerTotalCarrito() | number:'1.2-2' }} €
      </div>
      <button class="btn btn-success btn-lg px-5 shadow-sm" (click)="finalizarCompra()">
        <i class="bi bi-credit-card-fill me-2"></i>Finalizar compra
      </button>
    </div>

    <!-- Alerta de confirmación -->
    <div *ngIf="mensajeConfirmacion" class="alert alert-success text-center mt-4">
      {{ mensajeConfirmacion }}
    </div>

  </div>
</section>
