
<div class="background-shape"></div>

<main class="login-container">
  <div class="login-box">
    <h2 class="login-heading">Cambiar la contraseña</h2>

    <!-- Reactive form -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <!-- Nombre de usuario -->
      <div class="form-group">
        <label for="usuario">Nombre de usuario</label>
        <div class="input-icon">
          <i class="bi bi-person-fill"></i>
          <input
            type="text"
            id="usuario"
            formControlName="usuario"
            placeholder="usuario"
            required
          />
        </div>
        <small class="error" *ngIf="f['usuario'].touched && f['usuario'].invalid">
          El nombre de usuario es obligatorio.
        </small>
      </div>

      <!-- Contraseña actual -->
      <div class="form-group">
        <label for="current_password">Contraseña actual</label>
        <div class="input-icon">
          <i class="bi bi-shield-lock-fill"></i>
          <input
            type="password"
            id="current_password"
            formControlName="current_password"
            placeholder="********"
            required
          />
        </div>
        <small class="error" *ngIf="f['current_password'].touched && f['current_password'].invalid">
          La contraseña actual es obligatoria.
        </small>
      </div>

      <!-- Nueva contraseña -->
      <div class="form-group">
        <label for="new_password">Nueva contraseña</label>
        <div class="input-icon">
          <i class="bi bi-lock-fill"></i>
          <input
            type="password"
            id="new_password"
            formControlName="new_password"
            placeholder="********"
            required
          />
        </div>
        <small class="error" *ngIf="f['new_password'].touched && f['new_password'].invalid">
          La nueva contraseña debe tener al menos 6 caracteres.
        </small>
      </div>

      <!-- Confirmar contraseña -->
      <div class="form-group">
        <label for="new_password_confirmation">Confirmar nueva contraseña</label>
        <div class="input-icon">
          <i class="bi bi-lock"></i>
          <input
            type="password"
            id="new_password_confirmation"
            formControlName="new_password_confirmation"
            placeholder="********"
            required
          />
        </div>
        <small
          class="error"
          *ngIf="form.errors?.['passwordMismatch'] && f['new_password_confirmation'].touched"
        >
          Las contraseñas no coinciden.
        </small>
      </div>

      <!-- Mensajes -->
      <div class="alert success" *ngIf="success">{{ success }}</div>
      <div class="alert error" *ngIf="error">{{ error }}</div>

      <!-- Botón -->
      <button type="submit" class="btn-login" [disabled]="loading || form.invalid">
        {{ loading ? 'Actualizando…' : 'CAMBIAR CONTRASEÑA' }}
      </button>

      <!-- Vuelta al login -->
      <div class="register-option">
        ¿Recuerdas la contraseña?
        <a href="/login">Inicia sesión</a>
      </div>
    </form>
  </div>
</main>
